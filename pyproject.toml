[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siddhi"
version = "0.1.0"
description = "Portfolio intelligence and strategic planning system."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
siddhi = ["data/*.json", "adapters/sqlite/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]
